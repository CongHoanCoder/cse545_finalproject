# Integer Programming Problem parameters
n : 1024
data_load : True
use_lp_relaxation : True
lp_reinject_every : 20
n_lp_solutions_frac : 0.1

# Genetic Algorithm parameters
population_size: 300
num_generations: 300
tournament_size: 5
topsoln_frac : 0.15
swap_p : 0.3
inv_p : 0.2
delta_mutate_p : 0.35
keep_children : 5
stall_patience : 50
n_ga_runs : 10

# Wisdom of Artificial Crowds (WoAC) parameters
use_woac: True
woac_frac: 0.2        # Fraction of population to use as crowd (top performers)
woac_every: 25        # Apply WoAC every N generations